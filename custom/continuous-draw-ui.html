<div class="continuous-draw-guide">
<strong>全自動接力模式（iPhone 實驗功能）</strong><br/>
    1. 先選想抽的縣市（如果想全抽就按全部）<br/>
    2. 按「開啟抽選」，到 LINE 完成這個抽選<br/>
    3. 回到這個網頁，系統會自動記錄並直接開啟下一個 LINE 抽選<br/>
    4. 不想繼續時可按「暫停全自動接力」；若記錯可按「復原上一個」
</div>
<!-- FUNBOX_DRAW_FILTERS_STAY_HERE -->
<div class="continuous-draw-panel" id="continuousDrawPanel">
<div class="continuous-draw-title">📱 連續抽選模式</div>
<div class="continuous-draw-progress" id="continuousDrawProgress">載入中...</div>
<div class="continuous-draw-store" id="continuousDrawStore"></div>
<div class="continuous-draw-product" id="continuousDrawProduct">載入中...</div>
<div aria-live="polite" class="continuous-draw-status" id="continuousDrawStatus"></div>
<button class="continuous-draw-open" disabled="" id="continuousDrawOpen" type="button">🔗 開啟抽選</button>
<button class="continuous-draw-next" disabled="" id="continuousDrawNext" type="button">✅ 手動標記完成</button>
<button class="continuous-draw-skip-store" disabled="" id="continuousDrawSkipStore" type="button">⏭️ 跳過這家店</button>
<button class="continuous-draw-auto-toggle" id="continuousDrawAutoToggle" type="button">⏸️ 暫停全自動接力</button>
<button class="continuous-draw-undo" disabled="" id="continuousDrawUndo" type="button">↩️ 復原上一個</button>
<button class="continuous-draw-restore" disabled="" id="continuousDrawRestore" type="button">恢復已跳過店家</button>
</div>
<div aria-hidden="true" class="continuous-draw-stop-overlay" id="continuousDrawStopOverlay" role="button" tabindex="-1">

<span class="continuous-draw-stop-title">點一下停止</span>

</div>
