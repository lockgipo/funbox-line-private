<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Funbox 暫停服務</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 36%),
        #0f1115;
      color: #f5f7fa;
    }
    main {
      width: min(100%, 520px);
      text-align: center;
      padding: 40px 28px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(14px);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #cbd3dc;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f0b35a;
      box-shadow: 0 0 0 4px rgba(240,179,90,.12);
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 46px);
      line-height: 1.15;
      letter-spacing: -.03em;
    }
    p {
      margin: 18px auto 0;
      max-width: 360px;
      color: #aeb7c2;
      font-size: 17px;
      line-height: 1.7;
    }
    small {
      display: block;
      margin-top: 28px;
      color: #6f7883;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>暫停服務</div>
    <h1>Funbox 暫時停止使用</h1>
    <p>目前本頁面暫停開放，請先不要繼續操作。之後恢復服務時會重新開放。</p>
    <small>Funbox</small>
  </main>
</body>
</html>
